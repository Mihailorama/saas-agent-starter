# Permissive-licensed twin (ADR 0010): only Apache/BSD/MIT/PostgreSQL-licensed containers.
#   docker compose -f docker-compose.yml -f compose.permissive.yaml [--profile observability] up -d
# or put COMPOSE_FILE=docker-compose.yml:compose.permissive.yaml in .env.
# The app does not change: same service names, ports and env. What you lose: docs/LICENSES.md.
services:
  redis: # Valkey (BSD-3-Clause) instead of Redis 8 (RSALv2/SSPLv1/AGPLv3); same protocol
    image: valkey/valkey:9.1-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]

  # No Loki/Grafana (AGPL-3.0): traces in the Jaeger UI, metrics + alerts in the Prometheus UI,
  # logs via `docker compose logs`. The collector skips its Loki log pipeline.
  otel-collector:
    command: !override ["--config=/etc/otel/collector.yaml"]
    volumes: !override [./infra/otel:/etc/otel:ro]
    user: !reset null
  loki:
    profiles: !override [agpl-disabled]
  grafana:
    profiles: !override [agpl-disabled]

  # No Postiz (AGPL-3.0) in the marketing profile: schedule posts natively or with a tool you
  # license (docs/LICENSES.md). SerpBear (MIT) and the site stay.
  postiz:
    profiles: !override [agpl-disabled]
  postiz-db:
    profiles: !override [agpl-disabled]
  postiz-namespace:
    profiles: !override [agpl-disabled]

  # No Twenty (AGPL-3.0) in the crm profile: the worker's CRM sync dry-runs, or point it at a CRM
  # you license (docs/crm.md "Swapping the CRM", docs/LICENSES.md).
  twenty:
    profiles: !override [agpl-disabled]
  twenty-worker:
    profiles: !override [agpl-disabled]
  twenty-db:
    profiles: !override [agpl-disabled]
