# Production stack for one Docker host (tiers S/M). Deployed by `pnpm run deploy -- <env>`
# (scripts/deploy.mjs, docs/deploy.md), which copies this file to the server as compose.yaml,
# writes .env (decrypted deploy/env/<env>.enc.env + the IMAGE_* digests of the release) and runs
# `docker compose up -d --wait`. Nothing is built here: api, worker and web are the images CI
# pushed on a `v*` tag, pinned by digest. Optional on-box services are profiles, enabled with
# COMPOSE_PROFILES in the env file: db (Postgres), s3 (SeaweedFS), ops (Temporal UI on loopback),
# llm-cli (vendor CLI subscriptions, an image you build yourself: docs/llm-providers.md),
# booking (Cal.diy, image built by CI from a pinned upstream commit, IMAGE_CALDIY),
# vault (Vaultwarden, the secrets vault, docs/secrets.md), analytics (Umami, docs/product-analytics.md),
# gate (oauth2-proxy: the staff sign-in gate, docs/sso.md), openhands and bolt (app builders behind
# the gate, docs/app-builders.md), allure and reportportal (test reports, docs/test-reports.md).
# `pnpm run infra` (docs/setup.md) writes the env file and picks the profiles for you.
# Licenses of every image: docs/LICENSES.md.

x-logging: &logging
  driver: json-file
  options:
    labels: "com.docker.compose.project,com.docker.compose.service"
    max-size: 10m
    max-file: "5"

# ReportPortal services' shared settings (profile reportportal, below).
x-rp-env: &rp-env
  RP_DB_HOST: rp-postgres
  RP_DB_PORT: "5432"
  RP_DB_USER: rpuser
  RP_DB_PASS: ${REPORTPORTAL_DB_PASSWORD:-}
  RP_DB_NAME: reportportal
  RP_AMQP_HOST: rp-rabbitmq
  RP_AMQP_PORT: "5672"
  RP_AMQP_APIPORT: "15672"
  RP_AMQP_USER: rabbitmq
  RP_AMQP_PASS: ${REPORTPORTAL_RABBITMQ_PASSWORD:-}
  RP_AMQP_APIUSER: rabbitmq
  RP_AMQP_APIPASS: ${REPORTPORTAL_RABBITMQ_PASSWORD:-}
  RP_AMQP_ANALYZER-VHOST: analyzer
  DATASTORE_TYPE: filesystem

services:
  # Reverse proxy + automatic HTTPS (ADR 0016). The only service with public ports.
  caddy:
    image: caddy:2.11-alpine
    logging: *logging
    mem_limit: 128m
    restart: unless-stopped
    depends_on: [web]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS to an ACME e-mail or "internal"}
      # sites of on-box profiles (deploy/sites/<profile>.caddy, shipped only when enabled)
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      VAULT_PUBLIC_URL: ${VAULT_PUBLIC_URL:-}
      UMAMI_PUBLIC_URL: ${UMAMI_PUBLIC_URL:-}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-}
      GATE_PUBLIC_URL: ${GATE_PUBLIC_URL:-}
      OPENHANDS_PUBLIC_URL: ${OPENHANDS_PUBLIC_URL:-}
      BOLT_PUBLIC_URL: ${BOLT_PUBLIC_URL:-}
      ALLURE_PUBLIC_URL: ${ALLURE_PUBLIC_URL:-}
      REPORTPORTAL_PUBLIC_URL: ${REPORTPORTAL_PUBLIC_URL:-}
      # vault site: who may reach Vaultwarden's /admin; everyone else gets 403
      VAULT_ADMIN_IPS: ${VAULT_ADMIN_IPS:-127.0.0.1/32}
    ports:
      - "${PUBLISH_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLISH_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${PUBLISH_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data # certificates and ACME account: keep this volume
      - caddy_config:/config
    # builders: the app builders' own network (below); Caddy and the gate are the only way in.
    networks: [default, builders, tests]

  # One-shot: schema migrations + app role. scripts/deploy.mjs runs it with `docker compose run`
  # BEFORE `up`: within one `up`, Compose recreates api/worker/web before waiting for it, so a
  # failing migration would stop the running release. depends_on below keeps the order anyway.
  migrate:
    image: ${IMAGE_API:?no release, deploy with scripts/deploy.mjs}
    logging: *logging
    mem_limit: 256m
    command: ["node", "packages/db/src/migrate.ts"]
    environment: [DATABASE_URL, MIGRATION_DATABASE_URL]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  api:
    image: ${IMAGE_API:?no release, deploy with scripts/deploy.mjs}
    logging: *logging
    mem_limit: 384m
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=2 # hops in front of the API: Caddy, then the web container's nginx
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://${APP_DOMAIN}}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      # Passed through from .env when set, absent otherwise (an unset name also drops any default
      # the image sets for it):
      - LOG_LEVEL
      - DATABASE_URL
      - BETTER_AUTH_SECRET
      - CORS_ORIGINS
      - S3_ENDPOINT
      - S3_PUBLIC_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - SENTRY_DSN
      - OIDC_ISSUER
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      # Staff SSO into the tools (docs/sso.md): one secret + callback list per tool on this host.
      - SSO_VAULTWARDEN_SECRET
      - SSO_VAULTWARDEN_REDIRECT_URIS
      - SSO_OAUTH2_PROXY_SECRET
      - SSO_OAUTH2_PROXY_REDIRECT_URIS
      - POSTHOG_WEBHOOK_SECRET
      - POSTHOG_APP_HOST
      - POSTHOG_PROJECT_ID
      # profile pii: PII_REDACT_URL=http://pii:8000 (docs/support.md "Personal data")
      - PII_REDACT_URL
      - EMAIL_TASK_QUEUE
      - SIGNUP_BLOCK_DISPOSABLE
      - SIGNUP_EMAIL_ALLOW_DOMAINS
      - SIGNUP_EMAIL_DENY_DOMAINS
      - FLAGS_ON
      - FLAGS_OFF
      - POSTHOG_KEY
      - POSTHOG_HOST
      - POSTHOG_SECRET_KEY
      - AI_CONTENT_BUCKET
      - APP_NAME
      # operator console, Stack page: modes, sender, and the install.site key of each on-box tool
      - STACK_MODES
      # "Connect a model": subscription sign-ins run in llm-cli (docs/admin.md)
      - LLM_CLI_URL=${LLM_CLI_URL:-http://llm-cli:8080}
      - LLM_CLI_TOKEN
      - MAIL_FROM
      - CRM_PUBLIC_URL
      - UMAMI_PUBLIC_URL
      - VAULT_PUBLIC_URL
      - WEBHOOK_ENCRYPTION_KEYS
      - WEBHOOK_MAX_PAYLOAD_BYTES
      - API_KEY_RATE_LIMIT_PER_MINUTE
      - PASSKEY_RP_ID
      - CHATWOOT_WEBHOOK_SECRET
      - CHATWOOT_HMAC_TOKEN
      - GITHUB_WEBHOOK_SECRET
      - PLANE_WEBHOOK_SECRET
      - PLANE_PROJECT_ID
      # lite Telegram support (docs/support.md)
      - TELEGRAM_SUPPORT_BOT_TOKEN
      - TELEGRAM_SUPPORT_CHAT_ID
      # booking webhook -> CRM (docs/crm.md)
      - BOOKING_WEBHOOK_SECRET
      # billing (docs/billing.md); AI_CONTOUR picks the cost currencies the billing page shows
      - AI_CONTOUR=${AI_CONTOUR:-}
      - BILLING_CONTOUR
      - PLANS_FILE
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      # rewards (docs/growth.md): the worker applies money rewards through /internal/rewards
      - INTERNAL_API_TOKEN
      # referrals via Dub Partners (docs/growth.md); empty = native referrals
      - DUB_API_KEY
      # operator console (docs/admin.md); empty OPERATOR_EMAILS = no operators
      - OPERATOR_EMAILS
      - OPERATOR_SESSION_MAX_AGE_MINUTES
      - OPERATOR_IMPERSONATION_MINUTES
      # data-subject rights (docs/privacy.md)
      - PRIVACY_DELETION_GRACE_DAYS
      - PRIVACY_EXPORT_INTERVAL_HOURS
    healthcheck: # readiness: database + Redis reachable
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null"]
      interval: 5s
      start_period: 30s
      retries: 12
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      temporal-namespace: { condition: service_completed_successfully }
      s3: { condition: service_healthy, required: false }

  worker:
    image: ${IMAGE_WORKER:?no release, deploy with scripts/deploy.mjs}
    logging: *logging
    mem_limit: 512m # +~100 MiB for Presidio once support triage is on (docs/STACK.md)
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - AI_CONTOUR=${AI_CONTOUR:-}
      - DATABASE_URL
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - SENTRY_DSN
      - AI_CONTENT_BUCKET
      - AI_CONTENT_RETENTION_DAYS
      - AI_PROJECT_SUMMARY_PROVIDER
      - AI_PROJECT_SUMMARY_MODEL
      # providers (docs/llm-providers.md): CLI subscriptions via llm-cli, the rest via LiteLLM
      - LLM_CLI_URL=${LLM_CLI_URL:-http://llm-cli:8080}
      - LLM_CLI_TOKEN
      - AI_REQUEST_TIMEOUT_SECONDS
      - AI_CLI_TIMEOUT_SECONDS
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - XAI_API_KEY
      - MOONSHOT_API_KEY
      - OPENROUTER_API_KEY
      - OPENAI_COMPATIBLE_BASE_URL
      - OPENAI_COMPATIBLE_API_KEY
      - VLLM_BASE_URL
      - VLLM_API_KEY
      - OLLAMA_BASE_URL
      - AI_BYO_ALLOWED_CIDRS
      # external MCP tools (docs/mcp.md)
      - MCP_ALLOWED_CIDRS
      - MCP_TOOL_MAX_ITERATIONS
      - MCP_TOOL_TIMEOUT_SECONDS
      - EMAIL_TASK_QUEUE
      - SMTP_URL
      - MAIL_FROM
      - POSTHOG_PRIVACY_MODE
      # separate trace endpoint for the worker, e.g. Langfuse OTLP (ADR 0009)
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS
      # outbound webhooks (docs/public-api.md)
      - WEBHOOK_ENCRYPTION_KEYS
      - WEBHOOK_MAX_PAYLOAD_BYTES
      - WEBHOOK_ALLOWED_CIDRS
      - WEBHOOK_DISABLE_AFTER_FAILURES
      - WEBHOOK_RETENTION_DAYS
      # service desk triage (docs/support.md)
      - CHATWOOT_URL
      - CHATWOOT_PUBLIC_URL
      - CHATWOOT_API_TOKEN
      - TRACKER
      - GITHUB_TOKEN
      - GITHUB_REPO
      - PLANE_API_URL
      - PLANE_APP_URL
      - PLANE_WORKSPACE
      - PLANE_PROJECT_ID
      - PLANE_API_TOKEN
      - AI_SUPPORT_TRIAGE_PROVIDER
      - AI_SUPPORT_TRIAGE_MODEL
      - SUPPORT_AI_ORG_ID
      - AI_STACK_PLAN_PROVIDER
      - AI_STACK_PLAN_MODEL
      - STACK_AI_ORG_ID
      - SUPPORT_NOTIFY_ON_CLOSE
      - TELEGRAM_SUPPORT_BOT_TOKEN
      - TELEGRAM_SUPPORT_CHAT_ID
      - TELEGRAM_SUPPORT_WEBHOOK_URL
      # CRM sync (docs/crm.md): profile crm on this host (http://twenty:3000) or your own Twenty;
      # no key = dry run
      - TWENTY_API_URL
      - TWENTY_API_KEY
      - CRM_FILE
      - BOOKING_PUBLIC_URL
      - FLAGS_ON
      - FLAGS_OFF
      - POSTHOG_KEY
      - POSTHOG_HOST
      - POSTHOG_SECRET_KEY
      # billing: plans and LLM spend limits (default: config/plans.json in the image)
      - PLANS_FILE
      # usage reporting to Stripe Meters (docs/billing.md "Usage-based"); empty = off
      - STRIPE_SECRET_KEY
      # rewards (docs/growth.md): rules (default config/rewards.json) and the API link
      - REWARDS_FILE
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:3000}
      - INTERNAL_API_TOKEN
      # data-subject rights (docs/privacy.md): retention and per-person export/deletion in tools
      - PRIVACY_EXPORT_TTL_DAYS
      - PRIVACY_ORG_RECORDS_DAYS
      - POSTHOG_APP_HOST
      - POSTHOG_PROJECT_ID
      - POSTHOG_PERSONAL_API_KEY
      - LANGFUSE_HOST
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_SECRET_KEY
      - CHATWOOT_ACCOUNT_ID
      - CHATWOOT_ADMIN_API_TOKEN
      - GA4_PROPERTY_ID
      - GA4_SERVICE_ACCOUNT_JSON
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }

  # --- profile pii: Presidio PII redaction for the API's feedback hook (docs/support.md "Personal
  # data"). Same image as the worker. Enable with COMPOSE_PROFILES=pii and
  # PII_REDACT_URL=http://pii:8000; the API then fails closed (503) while it is down.
  pii:
    profiles: [pii]
    image: ${IMAGE_WORKER:?no release, deploy with scripts/deploy.mjs}
    logging: *logging
    mem_limit: 384m
    restart: unless-stopped
    command: ["python", "-m", "worker.pii"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 5s
      start_period: 60s
      retries: 12

  # Static files + /api proxy; sets CSP/HSTS/nosniff/Referrer-Policy (apps/web/nginx.conf.template).
  # Vendor CLI subscriptions for the worker (docs/llm-providers.md). Enable with COMPOSE_PROFILES
  # containing llm-cli and IMAGE_LLM_CLI in the env file: the image contains the proprietary
  # Claude Code CLI, so CI does not publish it. `pnpm run infra` builds it on the server when a
  # subscription is chosen; otherwise build services/llm-cli/Dockerfile yourself and push it to a
  # private registry. Logins: files in LLM_CLI_SECRETS_DIR on the host
  # (mode 600), named in its config. Internal only: no ports.
  llm-cli:
    profiles: [llm-cli]
    image: ${IMAGE_LLM_CLI:-set-IMAGE_LLM_CLI}
    logging: *logging
    mem_limit: 2g
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      - LLM_CLI_TOKEN
      - LLM_CLI_CONFIG=${LLM_CLI_CONFIG:-/etc/llm-cli/config.json}
    volumes:
      - ${LLM_CLI_SECRETS_DIR:-./llm-cli-secrets}:/run/secrets/llm-cli

  web:
    image: ${IMAGE_WEB:?no release, deploy with scripts/deploy.mjs}
    logging: *logging
    mem_limit: 64m
    restart: unless-stopped
    environment: # nginx's envsubst needs every variable defined, empty is fine
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:-}
      SENTRY_PUBLIC_ORIGIN: ${SENTRY_PUBLIC_ORIGIN:-}
      # analytics + survey origins (PostHog, Umami, Formbricks); VITE_* are baked in at build time
      ANALYTICS_ORIGINS: ${ANALYTICS_ORIGINS:-}
      SUPPORT_ORIGINS: ${SUPPORT_ORIGINS:-}
      BOOKING_ORIGINS: ${BOOKING_ORIGINS:-}
      # Consent regime (docs/product-analytics.md#consent); must not be empty (nginx map value)
      CONSENT_MODE: ${CONSENT_MODE:-opt-in}
      CONSENT_COUNTRY_HEADER: ${CONSENT_COUNTRY_HEADER:-cf_ipcountry}
      CONSENT_OPT_OUT_COUNTRIES: ${CONSENT_OPT_OUT_COUNTRIES:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 5s
      retries: 12
    depends_on:
      api: { condition: service_healthy }

  # Rate-limit store only (ADR 0007); nothing to persist. Deliveries that ban AGPL/SSPL set
  # REDIS_IMAGE=valkey/valkey:9.1-alpine (BSD-3-Clause, docs/LICENSES.md permissive twin).
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    logging: *logging
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || valkey-cli ping"]
      interval: 2s
      retries: 30

  # Temporal on the same Postgres server (as in docker-compose.yml). Temporal Cloud or a
  # dedicated cluster: point TEMPORAL_ADDRESS elsewhere and drop these three services.
  temporal-setup:
    image: temporalio/admin-tools:1.32.2
    logging: *logging
    mem_limit: 128m
    environment:
      POSTGRES_SEEDS: ${TEMPORAL_DB_HOST:-postgres}
      POSTGRES_USER: ${TEMPORAL_DB_USER:-postgres}
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
    volumes: ["./temporal-setup.sh:/setup.sh:ro"]
    entrypoint: ["/bin/sh", "/setup.sh"]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  temporal:
    image: temporalio/server:1.32.2
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: ${TEMPORAL_DB_HOST:-postgres}
      POSTGRES_USER: ${TEMPORAL_DB_USER:-postgres}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
    volumes:
      ["./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/production-sql.yaml:ro"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 3s
      start_period: 30s
      retries: 60
    depends_on:
      temporal-setup: { condition: service_completed_successfully }

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    logging: *logging
    mem_limit: 128m
    restart: on-failure:10
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        temporal operator cluster health --address temporal:7233 &&
        (temporal operator namespace describe -n default --address temporal:7233 ||
         temporal operator namespace create -n default --address temporal:7233)
    depends_on:
      temporal: { condition: service_healthy }

  # --- profile ops: Temporal Web UI, loopback only (ssh -L 8233:127.0.0.1:8233 <server>).
  temporal-ui:
    profiles: [ops]
    image: temporalio/ui:2.58.1
    logging: *logging
    mem_limit: 128m
    restart: unless-stopped
    environment: { TEMPORAL_ADDRESS: "temporal:7233", TEMPORAL_UI_PORT: "8233" }
    ports: ["127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }

  # --- profile db: Postgres on this host (tier S). Tier M: managed Postgres, drop the profile and
  # point DATABASE_URL / MIGRATION_DATABASE_URL / TEMPORAL_DB_* at it. Back it up (docs/deploy.md).
  postgres:
    profiles: [db]
    image: postgres:17-alpine
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # Over TCP: initdb's temporary server listens on the socket only, so a socket check
      # passes before the real server is up and migrate's TCP connect is refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 2s
      retries: 30

  # --- profile s3: SeaweedFS on this host (single server without managed S3). Internal only;
  # browser uploads use presigned URLs, so S3_PUBLIC_ENDPOINT must reach it: Caddy serves it
  # (deploy/sites/s3.caddy). Credentials: S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY become its admin.
  s3:
    profiles: [s3]
    image: chrislusf/seaweedfs:4.53
    logging: *logging
    mem_limit: 256m
    restart: unless-stopped
    command: server -dir=/data -s3 -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 2s
      retries: 30

  # --- profile booking: Cal.diy (MIT) on this host (docs/crm.md "Booking", ADR 0026). The image
  # is the one release.yml built from the pinned upstream commit (infra/caldiy/build.sh);
  # scripts/deploy.mjs pins it by digest when COMPOSE_PROFILES contains booking. Its database
  # lives on the app's Postgres server (create role + database `caldiy` once, docs/deploy.md), so
  # the backups cover it. Reachable through Caddy: add the booking site in deploy/Caddyfile.
  # Using Cal.com Cloud or a Cal.diy you already run elsewhere: leave the profile off.
  caldiy:
    profiles: [booking]
    image: ${IMAGE_CALDIY:-set-IMAGE_CALDIY-by-deploying-with-scripts-deploy.mjs}
    logging: *logging
    mem_limit: 1g
    restart: unless-stopped
    environment:
      - DATABASE_URL=${CALDIY_DATABASE_URL:-}
      - DATABASE_DIRECT_URL=${CALDIY_DATABASE_URL:-}
      - DATABASE_HOST=${CALDIY_DATABASE_HOST:-postgres:5432}
      - NEXT_PUBLIC_WEBAPP_URL=${CALDIY_PUBLIC_URL:-}
      - NEXT_PUBLIC_WEBSITE_URL=${CALDIY_PUBLIC_URL:-}
      - NEXTAUTH_URL=${CALDIY_PUBLIC_URL:-}/api/auth
      - NEXTAUTH_SECRET=${CALDIY_NEXTAUTH_SECRET:-}
      - CALENDSO_ENCRYPTION_KEY=${CALDIY_ENCRYPTION_KEY:-}
      - CRON_API_KEY=${CALDIY_CRON_API_KEY:-}
      - CALCOM_TELEMETRY_DISABLED=1
      - EMAIL_FROM=${CALDIY_EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${CALDIY_EMAIL_FROM_NAME:-}
      - EMAIL_SERVER_HOST=${CALDIY_SMTP_HOST:-}
      - EMAIL_SERVER_PORT=${CALDIY_SMTP_PORT:-587}
      - EMAIL_SERVER_USER=${CALDIY_SMTP_USER:-}
      - EMAIL_SERVER_PASSWORD=${CALDIY_SMTP_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      start_period: 5m
    depends_on:
      postgres: { condition: service_healthy, required: false }

  # --- one-shots of profiles vault and analytics: create their role and database on the on-box
  # Postgres (profile db), so the backups cover them; idempotent (deploy/db-init.sh). Passwords
  # come from the env, never argv; `pnpm run infra` generates them. No password set: skipped.
  vault-db:
    profiles: [vault]
    image: postgres:17-alpine
    logging: *logging
    mem_limit: 64m
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      DB_PASSWORD: ${VAULT_DB_PASSWORD:-}
      DB_NAME: vaultwarden
    entrypoint: ["/bin/sh", "/db-init.sh"]
    volumes: ["./db-init.sh:/db-init.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  umami-db:
    profiles: [analytics]
    image: postgres:17-alpine
    logging: *logging
    mem_limit: 64m
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      DB_NAME: umami
    entrypoint: ["/bin/sh", "/db-init.sh"]
    volumes: ["./db-init.sh:/db-init.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  # --- profile analytics: Umami (MIT), self-hosted product analytics (docs/product-analytics.md).
  # Its own domain through Caddy (deploy/sites/analytics.caddy). PRIVATE_MODE: calls nothing
  # outside. The default admin/umami login is replaced by UMAMI_ADMIN_PASSWORD after the first
  # deploy (deploy/setup/umami-admin.sh, run by `pnpm run infra`). PostHog Cloud: leave it off.
  umami:
    profiles: [analytics]
    image: ghcr.io/umami-software/umami:3.5.0
    logging: *logging
    init: true
    mem_limit: 1g
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      PRIVATE_MODE: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null"]
      interval: 5s
      start_period: 60s
      retries: 30
    depends_on:
      umami-db: { condition: service_completed_successfully }

  # --- profile crm: Twenty (AGPL-3.0 + app exception, unmodified; docs/crm.md, ADR 0026) at
  # CRM_PUBLIC_URL. Role + database `twenty` on the app's Postgres (twenty-db; the backups cover
  # it), Redis db 4, attachments in the twenty_data volume. The worker syncs to it once
  # TWENTY_API_KEY is set (an API key made in Twenty: Settings, APIs). ~2.5 GiB (docs/STACK.md).
  twenty-db:
    profiles: [crm]
    image: postgres:17-alpine
    logging: *logging
    mem_limit: 64m
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      DB_PASSWORD: ${TWENTY_DB_PASSWORD:-}
      DB_NAME: twenty
    entrypoint: ["/bin/sh", "/db-init.sh"]
    volumes: ["./db-init.sh:/db-init.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  twenty:
    profiles: [crm]
    image: twentycrm/twenty:v2.57.0@sha256:17293aa80415035cdeb5f43bd222072b2c00527195c584e4f0d967923e99d9e1
    logging: *logging
    mem_limit: 1536m
    restart: unless-stopped
    stop_grace_period: 60s
    environment: &twenty-env
      PG_DATABASE_URL: postgres://twenty:${TWENTY_DB_PASSWORD:-}@postgres:5432/twenty
      SERVER_URL: ${CRM_PUBLIC_URL:-}
      REDIS_URL: redis://redis:6379/4
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:-}
      APP_SECRET: ${TWENTY_ENCRYPTION_KEY:-}
      STORAGE_TYPE: local
      TELEMETRY_ENABLED: "false"
    volumes: [twenty_data:/app/packages/twenty-server/.local-storage]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz >/dev/null"]
      interval: 10s
      start_period: 20m # the first start runs ~580 migration steps
      retries: 30
    depends_on:
      twenty-db: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  twenty-worker:
    profiles: [crm]
    image: twentycrm/twenty:v2.57.0@sha256:17293aa80415035cdeb5f43bd222072b2c00527195c584e4f0d967923e99d9e1
    logging: *logging
    mem_limit: 1g
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      NODE_OPTIONS: --max-old-space-size=768
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes: [twenty_data:/app/packages/twenty-server/.local-storage]
    depends_on: { twenty: { condition: service_healthy } }

  # --- profile vault: Vaultwarden (AGPL-3.0, unmodified) as the team's secrets vault for humans
  # and coding agents (docs/secrets.md). Its database lives on the app's Postgres server (create
  # role + database `vaultwarden`: vault-db), so the backups cover it. Reachable only
  # through Caddy over TLS (deploy/sites/vault.caddy). No public signups; accounts are
  # invited from /admin, which is on only while VAULT_ADMIN_TOKEN (an argon2 hash) is set and is
  # reachable only from VAULT_ADMIN_IPS (Caddy). Its database: the vault-db one-shot above.
  # Using Bitwarden Cloud or a Vaultwarden you already run: leave the profile off.
  vault:
    profiles: [vault]
    image: vaultwarden/server:1.37.5-alpine@sha256:bbe684a02d6b0db54256ff88eac9754f4519284a7b26314afc241fd7d0918191
    logging: *logging
    mem_limit: 128m
    restart: unless-stopped
    # Refuses to start with a plain-text admin token: empty (admin off) or an argon2 PHC hash only.
    # No VAULT_SMTP_HOST: mail off (Vaultwarden refuses empty SMTP_* values).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$SMTP_HOST" ] || unset SMTP_HOST SMTP_FROM SMTP_PORT SMTP_SECURITY SMTP_USERNAME SMTP_PASSWORD;
        if [ -n "$$SSO_CLIENT_SECRET" ]; then export SSO_ENABLED=true; else unset SSO_AUTHORITY SSO_CLIENT_ID SSO_CLIENT_SECRET SSO_SCOPES SSO_PKCE; fi;
        case "$$ADMIN_TOKEN" in ""|'$$argon2'*) exec /start.sh ;;
        *) echo "VAULT_ADMIN_TOKEN must be an argon2 hash (docs/secrets.md)" >&2; exit 1 ;; esac
    environment:
      - DATABASE_URL=${VAULT_DATABASE_URL:-}
      - DOMAIN=${VAULT_PUBLIC_URL:-}
      - ADMIN_TOKEN=${VAULT_ADMIN_TOKEN:-}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - USER_ATTACHMENT_LIMIT=0
      - ORG_ATTACHMENT_LIMIT=0
      - SENDS_ALLOWED=false
      - IP_HEADER=X-Forwarded-For
      - SMTP_HOST=${VAULT_SMTP_HOST:-}
      - SMTP_PORT=${VAULT_SMTP_PORT:-587}
      - SMTP_SECURITY=${VAULT_SMTP_SECURITY:-starttls}
      - SMTP_USERNAME=${VAULT_SMTP_USERNAME:-}
      - SMTP_PASSWORD=${VAULT_SMTP_PASSWORD:-}
      - SMTP_FROM=${VAULT_SMTP_FROM:-}
      # Sign in with the app (docs/sso.md) when SSO_VAULTWARDEN_SECRET is set. The master password
      # still unlocks the vault: SSO replaces the login, not the encryption key.
      - SSO_AUTHORITY=${BETTER_AUTH_URL:-https://${APP_DOMAIN}}/api/auth
      - SSO_CLIENT_ID=vaultwarden
      - SSO_CLIENT_SECRET=${SSO_VAULTWARDEN_SECRET:-}
      - SSO_SCOPES=email profile offline_access
      - SSO_PKCE=true
    volumes: [vault_data:/data] # RSA signing key + icon cache only; secrets are in Postgres
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/alive"]
      interval: 5s
      start_period: 30s
      retries: 12
    depends_on:
      postgres: { condition: service_healthy, required: false }
      vault-db: { condition: service_completed_successfully }

  # --- profile gate: oauth2-proxy (MIT) signs people in with the app (docs/sso.md) in front of tools
  # that have no login of their own. Caddy asks it on every request to such a site (forward_auth,
  # the `gated` snippet in deploy/Caddyfile); only operators with two-factor get a token, so only
  # they get through. One callback for all sites at GATE_PUBLIC_URL, the cookie covers *.APP_DOMAIN.
  gate:
    profiles: [gate]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    logging: *logging
    mem_limit: 64m
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${BETTER_AUTH_URL:-https://${APP_DOMAIN}}/api/auth
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${SSO_OAUTH2_PROXY_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: ${GATE_PUBLIC_URL:-}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${GATE_COOKIE_SECRET:-}
      OAUTH2_PROXY_COOKIE_DOMAINS: .${APP_DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${APP_DOMAIN}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SCOPE: openid email profile groups
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_ALLOWED_GROUPS: operators
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Ask the app again every 8 hours, so someone taken off OPERATOR_EMAILS is out within a day.
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    networks: [builders]

  # --- App builders (docs/app-builders.md): agents build the company's internal apps. Each is a
  # profile of its own, the owner picks one or several. They run code an agent writes, so they sit
  # on the `builders` network (no route to Postgres, Redis, Temporal or the API's port; through
  # Caddy they see only what is public anyway) and are reachable only through Caddy behind the gate.
  # Model keys are entered in each tool's own settings.
  # OpenHands Agent Canvas (MIT): the agent runs commands inside this container, on the
  # `openhands_projects` volume; no Docker socket. Its code can read the model keys stored here.
  openhands:
    profiles: [openhands]
    image: ghcr.io/openhands/agent-canvas:1.38.0@sha256:30e638898361d7c87350a29291d2066af9942007087510845d13f4eaf4aeab46
    logging: *logging
    mem_limit: 2g
    restart: unless-stopped
    environment:
      # The UI gets its session key without asking: the gate is what keeps strangers out.
      AGENT_CANVAS_ALLOW_LAN_SESSION_KEY: "true"
      # No usage data to OpenHands: the page (DISABLE_TELEMETRY) and the agent server (DO_NOT_TRACK,
      # its kill switch: the setting cannot turn it back on).
      AGENT_CANVAS_DISABLE_TELEMETRY: "true"
      DO_NOT_TRACK: "1"
    volumes:
      - openhands_state:/home/openhands/.openhands # settings, model keys, conversations
      - openhands_projects:/projects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/alive"]
      interval: 10s
      start_period: 60s
      retries: 12
    networks: [builders]

  # bolt.diy (MIT): builds and previews apps in the visitor's browser (StackBlitz WebContainers;
  # production use in a for-profit company needs StackBlitz's commercial license, see
  # docs/app-builders.md). Projects live in the browser, not on the server.
  bolt:
    profiles: [bolt]
    image: ghcr.io/stackblitz-labs/bolt.diy:v1.0.3@sha256:89f1061e2ffad4f51125c6f931f18a4b2aaec2a1010799ea6b9608f399d7c99e
    logging: *logging
    mem_limit: 1g
    restart: unless-stopped
    environment:
      VITE_LOG_LEVEL: info
      # Its server answers only hosts it knows; a leading dot allows every subdomain.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .${APP_DOMAIN}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      start_period: 60s
      retries: 12
    networks: [builders]

  # --- Test reports (docs/test-reports.md): CI sends each run's JUnit XML (scripts/test-report.mjs)
  # to one or both. They sit on the `tests` network, reachable only through Caddy.
  # Allure (Apache-2.0, allure-docker-service): a report per run with history and trends. CI signs
  # in with its own admin login to send results; people open the reports behind the gate.
  allure:
    profiles: [allure]
    image: frankescobar/allure-docker-service:2.44.0@sha256:ccc55fa1f9001669defec1e4a27454fb45760d99e2be4efa688cfd4e12d3dd5f
    logging: *logging
    mem_limit: 768m
    restart: unless-stopped
    environment:
      CHECK_RESULTS_EVERY_SECONDS: NONE # a report only when CI asks for one
      KEEP_HISTORY: "1"
      KEEP_HISTORY_LATEST: "30"
      SECURITY_ENABLED: "1"
      SECURITY_USER: ci
      SECURITY_PASS: ${ALLURE_CI_PASSWORD:-}
      JWT_SECRET_KEY: ${ALLURE_JWT_SECRET:-} # signs the CI login's tokens
      MAKE_VIEWER_ENDPOINTS_PUBLIC: "1" # reading is guarded by the gate in front
    volumes: [allure_projects:/app/projects]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5050/allure-docker-service/version"]
      interval: 10s
      start_period: 30s
      retries: 12
    networks: [tests]

  # ReportPortal (Apache-2.0): a test results server with dashboards, failure triage (an analyzer on
  # OpenSearch), email notifications and its own logins. The services and settings follow upstream's
  # docker-compose.yml (reportportal/reportportal 26.0.7), names prefixed rp-; Traefik reads its
  # routes from a file here instead of the Docker socket.
  rp-gateway:
    profiles: [reportportal]
    image: traefik:v2.11.60@sha256:74fe8a2e317dbfbdca113347633b44a00a11d57170bc01147c150469418a4bc3
    logging: *logging
    mem_limit: 64m
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/routes.yml
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8081
      - --api.insecure=true # the index service reads the routes from this API (port 8081, not published)
    configs: [{ source: rp_routes, target: /etc/traefik/routes.yml }]
    networks: [tests]
  rp-postgres:
    profiles: [reportportal]
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    logging: *logging
    mem_limit: 512m
    shm_size: 256m
    restart: unless-stopped
    environment:
      {
        POSTGRES_USER: rpuser,
        POSTGRES_PASSWORD: "${REPORTPORTAL_DB_PASSWORD:-}",
        POSTGRES_DB: reportportal,
      }
    volumes: [rp_postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d reportportal -U rpuser"]
      interval: 10s
      retries: 12
    networks: [tests]
  rp-rabbitmq:
    profiles: [reportportal]
    image: rabbitmq:4.4.0-management@sha256:753099a19b577c322117f793f864b3129cbba96d40317221a69d73976e3c843c
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      {
        RABBITMQ_DEFAULT_USER: rabbitmq,
        RABBITMQ_DEFAULT_PASS: "${REPORTPORTAL_RABBITMQ_PASSWORD:-}",
      }
    configs:
      - { source: rp_rabbitmq_conf, target: /etc/rabbitmq/conf.d/99-extra.conf }
      - { source: rp_rabbitmq_plugins, target: /etc/rabbitmq/enabled_plugins }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      start_period: 60s
      retries: 5
    networks: [tests]
  rp-opensearch:
    profiles: [reportportal]
    image: opensearchproject/opensearch:3.9.0@sha256:3bf4fe26aeb9f7b03c0ebcb1302bb24e855ee6b89fd926d26a71a83ef6f7e076
    logging: *logging
    mem_limit: 1536m # 512m heap; 940 MiB in use idle
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes: [rp_opensearch:/usr/share/opensearch/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''',
        ]
      interval: 30s
      start_period: 120s
      retries: 5
    networks: [tests]
  rp-migrations:
    profiles: [reportportal]
    image: reportportal/migrations:5.15.6@sha256:0b0d2195b9464f595f2e38156e001a28d7a83ea8bc341c14564dead48e1a0481
    logging: *logging
    mem_limit: 128m
    restart: on-failure:10
    environment:
      POSTGRES_SERVER: rp-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: reportportal
      POSTGRES_USER: rpuser
      POSTGRES_PASSWORD: ${REPORTPORTAL_DB_PASSWORD:-}
    depends_on: { rp-postgres: { condition: service_healthy } }
    networks: [tests]
  rp-index:
    profiles: [reportportal]
    image: reportportal/service-index:5.15.2@sha256:7f78a31a8c8de586a3da002e8fe536dcc934c5355d1f63609f21cab9760fd4b0
    logging: *logging
    mem_limit: 64m
    restart: unless-stopped
    environment: { LB_URL: "http://rp-gateway:8081", TRAEFIK_V2_MODE: "true" }
    depends_on: [rp-gateway]
    networks: [tests]
  rp-ui:
    profiles: [reportportal]
    image: reportportal/service-ui:5.15.6@sha256:7f604771ce24f9b34a1afca8ff773a7f64ae2d629a09993f010e3205a30c8c6a
    logging: *logging
    mem_limit: 64m
    restart: unless-stopped
    environment: { RP_SERVER_PORT: "8080" }
    networks: [tests]
  rp-api:
    profiles: [reportportal]
    image: reportportal/service-api:5.15.6@sha256:073981492e191aeb4c069ec6546b8b806eec4702015730528a8cd55cdb1e4513
    logging: *logging
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      <<: *rp-env
      AUDIT_LOGGER: "OFF"
      RP_REQUESTLOGGING: "false"
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      RP_ENVIRONMENT_VARIABLE_ALLOW_DELETE_ACCOUNT: "false"
      RP_JOBS_BASEURL: http://rp-jobs:8686
      COM_TA_REPORTPORTAL_JOB_INTERRUPT_BROKEN_LAUNCHES_CRON: PT1H
      COM_TA_REPORTPORTAL_JOB_LOAD_PLUGINS_CRON: PT10S
      COM_TA_REPORTPORTAL_JOB_CLEAN_OUTDATED_PLUGINS_CRON: PT10S
      REPORTING_QUEUES_COUNT: "10"
      REPORTING_CONSUMER_PREFETCHCOUNT: "10"
      REPORTING_PARKINGLOT_TTL_DAYS: "7"
      JAVA_OPTS: -Xmx1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
    volumes: [rp_storage:/data/storage]
    depends_on:
      rp-rabbitmq: { condition: service_healthy }
      rp-postgres: { condition: service_healthy }
      rp-jobs: { condition: service_healthy }
      rp-migrations: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8585/health"]
      interval: 30s
      start_period: 120s
      retries: 6
    networks: [tests]
  rp-uat:
    profiles: [reportportal]
    image: reportportal/service-authorization:5.15.2@sha256:ba5e19462975fed8fa7a387388a8a838af4f90e1dcd2a560d7493eba776a28d3
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *rp-env
      RP_SESSION_LIVE: "86400"
      # Password of the built-in `superadmin` on first start; change it in the profile after signing in.
      RP_INITIAL_ADMIN_PASSWORD: ${REPORTPORTAL_ADMIN_PASSWORD:-}
      JAVA_OPTS: -Djava.security.egd=file:/dev/./urandom -XX:MinRAMPercentage=60.0 -XX:MaxRAMPercentage=90.0 --add-opens=java.base/java.lang=ALL-UNNAMED
    volumes: [rp_storage:/data/storage]
    depends_on: { rp-migrations: { condition: service_completed_successfully } }
    networks: [tests]
  rp-jobs:
    profiles: [reportportal]
    image: reportportal/service-jobs:5.15.3@sha256:ce806f1b3acb7ed4b1b7d6cd74e026144c58815d25864f66c8cffc5f96814ced
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *rp-env
      RP_ENVIRONMENT_VARIABLE_CLEAN_ATTACHMENT_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_LOG_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_LAUNCH_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_STORAGE_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_STORAGE_PROJECT_CRON: 0 */5 * * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_EVENTS_CRON: 0 30 05 * * *
      JAVA_OPTS: -Djava.security.egd=file:/dev/./urandom -XX:+UseG1GC -XX:MaxRAMPercentage=70.0
    volumes: [rp_storage:/data/storage]
    depends_on:
      rp-rabbitmq: { condition: service_healthy }
      rp-migrations: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8686/health"]
      interval: 30s
      start_period: 120s
      retries: 6
    networks: [tests]
  rp-analyzer:
    profiles: [reportportal]
    image: reportportal/service-auto-analyzer:5.15.6@sha256:0eacfd822756deb44367088309ca49b7bf62cd3d190d5a93c24546e5ce6e3fdd
    logging: *logging
    mem_limit: 1g
    restart: unless-stopped
    environment:
      LOGGING_LEVEL: info
      AMQP_EXCHANGE_NAME: analyzer-default
      AMQP_VIRTUAL_HOST: analyzer
      AMQP_URL: amqp://rabbitmq:${REPORTPORTAL_RABBITMQ_PASSWORD:-}@rp-rabbitmq:5672
      ES_HOSTS: http://rp-opensearch:9200
      ANALYZER_BINARYSTORE_TYPE: filesystem
      DATASTORE_TYPE: filesystem
      FILESYSTEM_DEFAULT_PATH: /data/storage/analyzer
    volumes: [rp_analyzer:/data/storage/analyzer]
    depends_on:
      rp-analyzer-init: { condition: service_completed_successfully }
      rp-opensearch: { condition: service_healthy }
      rp-rabbitmq: { condition: service_healthy }
    networks: [tests]
  # The analyzer runs as uid 65532; a new volume belongs to root (upstream does this with busybox).
  rp-analyzer-init:
    profiles: [reportportal]
    image: reportportal/service-auto-analyzer:5.15.6@sha256:0eacfd822756deb44367088309ca49b7bf62cd3d190d5a93c24546e5ce6e3fdd
    logging: *logging
    user: "0:0"
    entrypoint: ["python", "-c", "import os; os.chown('/data', 65532, 65532)"] # distroless: no shell
    volumes: [rp_analyzer:/data]
    network_mode: none
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  s3data:
  vault_data:
  twenty_data:
  openhands_state:
  openhands_projects:
  allure_projects:
  rp_postgres:
  rp_opensearch:
  rp_storage:
  rp_analyzer:

networks:
  default:
  builders:
  tests:

# ReportPortal: Traefik routes (upstream sets them as Docker labels) and RabbitMQ settings.
configs:
  rp_routes:
    content: |
      http:
        middlewares:
          strip: { stripPrefix: { prefixes: ["/ui", "/api", "/uat"] } }
        routers:
          index: { rule: "PathPrefix(`/`)", service: index, entryPoints: [web] }
          ui: { rule: "PathPrefix(`/ui`)", service: ui, middlewares: [strip], entryPoints: [web] }
          api: { rule: "PathPrefix(`/api`)", service: api, middlewares: [strip], entryPoints: [web] }
          uat: { rule: "PathPrefix(`/uat`)", service: uat, middlewares: [strip], entryPoints: [web] }
        services:
          index: { loadBalancer: { servers: [{ url: "http://rp-index:8080" }] } }
          ui: { loadBalancer: { servers: [{ url: "http://rp-ui:8080" }] } }
          api: { loadBalancer: { servers: [{ url: "http://rp-api:8585" }] } }
          uat: { loadBalancer: { servers: [{ url: "http://rp-uat:9999" }] } }
  rp_rabbitmq_conf:
    content: |
      deprecated_features.permit.queue_master_locator = true
      disk_free_limit.absolute = 50MB
  rp_rabbitmq_plugins:
    content: |
      [rabbitmq_management,rabbitmq_consistent_hash_exchange,rabbitmq_shovel,rabbitmq_shovel_management].
