version: 2
# Conventional PR titles (chore(deps): bump ...), see docs/releases.md.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups: { npm: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      # Types track the Node runtime major (22).
      - { dependency-name: "@types/node", update-types: [version-update:semver-major] }
      # The data table follows shadcn/ui's pattern, which is written for TanStack Table v8; v9 is
      # a different API. Move when shadcn/ui's data table does.
      - { dependency-name: "@tanstack/react-table", update-types: [version-update:semver-major] }
  - package-ecosystem: uv
    directory: /services/worker-py
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /services/worker-py, /infra/backup]
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    ignore:
      - { dependency-name: node, update-types: [version-update:semver-major] }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
