name: UI

# UI quality checks for apps/web (docs/ui.md, ADR 0023). Accessibility (axe) and the layout
# guards (overflow, clipped text, overlapping controls, console errors, broken images) run in the
# CI `check` job through `pnpm check`. Screenshots are compared only locally, against main, before
# the push (`pnpm --filter web visual`); CI compares no pixels and has no human approval step.
# This workflow adds:
# - impeccable: the design anti-pattern detector (Apache-2.0) on the source and the rendered pages.
# - lighthouse: Lighthouse CI budgets (accessibility, best practices) on the public pages.
on:
  pull_request:
    paths:
      - apps/web/**
      - config/ai-models.json
      - config/ai-transparency.json
      - pnpm-lock.yaml
      - .github/workflows/ui.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - config/ai-models.json
      - config/ai-transparency.json
      - pnpm-lock.yaml
      - .github/workflows/ui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

env:
  # https://github.com/pbakaus/impeccable/releases (engine binary, Apache-2.0); bump both together.
  IMPECCABLE_VERSION: 0.1.19
  IMPECCABLE_SHA256: 07b763dc00012e9acf219fe2d2e8980f0810fb8af2e4a41c090107a8351d412f
  PLAYWRIGHT_PORT: "5173"

jobs:
  impeccable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web...
      # Offline after download: no account, no key, no network at scan time. URL scans drive
      # the runner's Google Chrome against the local dev server.
      - name: Install the detector (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/impeccable" \
            "https://github.com/pbakaus/impeccable/releases/download/engine-v$IMPECCABLE_VERSION/impeccable-linux-x64"
          echo "$IMPECCABLE_SHA256  $RUNNER_TEMP/impeccable" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/impeccable"
      - name: Scan the source
        run: '"$RUNNER_TEMP/impeccable" detect --github apps/web/src'
      - name: Scan the rendered gallery, reference screens and public pages
        run: |
          pnpm --filter web exec vite --port "$PLAYWRIGHT_PORT" --strictPort > vite.log 2>&1 &
          base="http://localhost:$PLAYWRIGHT_PORT"
          timeout 60 sh -c "until curl -sf $base/ > /dev/null; do sleep 1; done"
          urls="$base/dev/ui $base/sign-in $base/ai-transparency"
          for s in list detail form settings empty loading error; do urls="$urls $base/dev/ui/screens/$s"; done
          status=0
          for viewport in 1280x800 390x844; do
            "$RUNNER_TEMP/impeccable" detect --viewport "$viewport" $urls || status=1
          done
          exit $status

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The sign-in page asks the API for its config; the API needs Postgres, Redis and S3 to start.
      - run: docker compose up -d --wait postgres redis s3
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Start the API
        run: |
          pnpm --filter api start > api.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://localhost:3000/readyz > /dev/null; do sleep 1; done'
      - run: pnpm --filter web build
      - name: The dev gallery is not in the production build
        run: '! grep -rlE "UI gallery|Reference screens" apps/web/dist'
      # Lighthouse CI runs via dlx, not as a dependency, like the marketing site's check:
      # lighthouse pulls @sentry/node and with it the FSL-licensed `sentry` CLI (docs/LICENSES.md).
      - run: pnpm --filter web lhci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-web-reports
          path: apps/web/.lighthouseci/reports/
          if-no-files-found: ignore
      - if: failure()
        run: tail -n 50 api.log; docker compose logs --tail 50
