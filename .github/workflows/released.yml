name: Released

# Comments "Released in vX.Y.Z" on the tracker items the PRs in a release refer to
# (docs/releases.md). Triggered when a person (or a workflow-triggering token)
# publishes a release, and called by release-please.yml, whose GITHUB_TOKEN releases start
# no workflows on their own.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      PLANE_API_TOKEN:
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  comment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history: the range is previous v* tag..this tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The tracker client the app uses (services/worker-py/worker/tracker.py).
      - run: uv run --locked --directory services/worker-py python -m worker.released "$TAG"
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
          # Plane by default (docs/releases.md): repository variables + the API key as a secret.
          # Without them the script does nothing. TRACKER=github comments on GitHub issues instead.
          # Use the worker's PLANE_API_TOKEN (same Plane user): the return path only acts on
          # release comments that user wrote.
          TRACKER: ${{ vars.TRACKER || 'plane' }}
          PLANE_API_URL: ${{ vars.PLANE_API_URL }}
          PLANE_APP_URL: ${{ vars.PLANE_APP_URL }}
          PLANE_WORKSPACE: ${{ vars.PLANE_WORKSPACE }}
          PLANE_PROJECT_ID: ${{ vars.PLANE_PROJECT_ID }}
          PLANE_API_TOKEN: ${{ secrets.PLANE_API_TOKEN }}
