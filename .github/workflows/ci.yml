name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # release-please.yml dispatches it on new v* tags

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      - name: Start infra
        run: docker compose --profile billing --profile mcp up -d --wait postgres redis s3 temporal-ui mailpit stripe-mock mcp-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      # Delivers the auth mails the tests read from Mailpit. Email queue only: the API tests
      # inspect project workflows themselves.
      - name: Start the worker
        run: |
          (cd services/worker-py && uv sync --locked)
          TEMPORAL_TASK_QUEUE=ci-unused pnpm worker > worker.log 2>&1 &
          timeout 60 sh -c 'until grep -q "worker started" worker.log; do sleep 1; done'
      - run: pnpm check
      - name: Release typecheck with official TypeScript (tsc, Go); see ADR 0011
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm typecheck
      - if: failure()
        run: docker compose logs --tail 100; tail -n 100 worker.log

  # The app must not care which rate-limit store runs: API integration tests on both twins.
  api-kv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kv: [redis, valkey]
    env:
      COMPOSE_FILE: ${{ matrix.kv == 'valkey' && 'docker-compose.yml:compose.permissive.yaml' || 'docker-compose.yml' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Start infra (${{ matrix.kv }})
        run: docker compose --profile billing up -d --wait postgres redis s3 temporal-ui mailpit stripe-mock
      - name: Check the store image
        run: docker compose images redis | tee /dev/stderr | grep -q "${{ matrix.kv }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Start the worker (email queue only)
        run: |
          (cd services/worker-py && uv sync --locked)
          TEMPORAL_TASK_QUEUE=ci-unused pnpm worker > worker.log 2>&1 &
          timeout 60 sh -c 'until grep -q "worker started" worker.log; do sleep 1; done'
      - run: pnpm --filter api test
      - if: failure()
        run: docker compose logs --tail 100; tail -n 100 worker.log

  # Backup -> destroy -> restore with the real containers (ADR 0015, docs/backups.md).
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: backup-e2e
      COMPOSE_FILE: docker-compose.yml:compose.backup.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/backup-e2e.sh

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --profile marketing build api web worker site

  # Cal.diy for the booking profile (ADR 0026, docs/crm.md): upstream publishes no image, so it
  # is built here from the pinned commit with upstream's own Dockerfile (infra/caldiy/build.sh),
  # scanned with Trivy, then booted on our Postgres the way `--profile booking` runs it.
  caldiy-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space (the Next.js monorepo build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /
      - run: infra/caldiy/build.sh caldiy:ci
      - name: Scan with Trivy (fails on fixable critical vulnerabilities)
        run: |
          infra/caldiy/scan.sh caldiy:ci
      - name: Boot on our Postgres (migrations, login page, memory)
        env:
          CALDIY_IMAGE: caldiy:ci
        run: |
          docker compose --profile booking up -d --wait --wait-timeout 600 caldiy
          curl -fsS -o /dev/null -w 'login page: HTTP %{http_code}\n' http://localhost:3500/auth/login
          sleep 60 # settle after the first requests, then measure
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose --profile booking logs --tail 200 caldiy caldiy-db

  # The production deploy path end to end on the runner (deploy/rehearsal.sh, docs/deploy.md):
  # SOPS-encrypted env, Caddy internal CA, migrate, deploy v1 -> v2, rollback, failing migration.
  deploy-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sops and age (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin=$RUNNER_TEMP/bin && mkdir -p "$bin" && cd "$RUNNER_TEMP"
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          curl -fsSLO https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age-v1.3.2-linux-amd64.tar.gz" | sha256sum -c
          tar xzf age-v1.3.2-linux-amd64.tar.gz
          install -m 755 sops age/age age/age-keygen "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
      - run: deploy/rehearsal.sh

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scan what this run adds: the PR's own commits, or main's history on a push. gitleaks' default
      # is every ref, so an unrelated branch's test fixture would fail every PR.
      - env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD' }}
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --log-opts="$RANGE"

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan source -r /src
