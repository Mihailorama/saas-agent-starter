name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      - name: Start infra
        run: docker compose up -d --wait postgres redis s3 temporal-ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm check
      - name: Release typecheck with official TypeScript (tsc, Go); see ADR 0011
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm typecheck
      - if: failure()
        run: docker compose logs --tail 100

  # The app must not care which rate-limit store runs: API integration tests on both twins.
  api-kv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kv: [redis, valkey]
    env:
      COMPOSE_FILE: ${{ matrix.kv == 'valkey' && 'docker-compose.yml:compose.permissive.yaml' || 'docker-compose.yml' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Start infra (${{ matrix.kv }})
        run: docker compose up -d --wait postgres redis s3 temporal-ui
      - name: Check the store image
        run: docker compose images redis | tee /dev/stderr | grep -q "${{ matrix.kv }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter api test
      - if: failure()
        run: docker compose logs --tail 100

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build api web worker

  # The production deploy path end to end on the runner (deploy/rehearsal.sh, docs/deploy.md):
  # SOPS-encrypted env, Caddy internal CA, migrate, deploy v1 -> v2, rollback, failing migration.
  deploy-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sops and age (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin=$RUNNER_TEMP/bin && mkdir -p "$bin" && cd "$RUNNER_TEMP"
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          curl -fsSLO https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age-v1.3.2-linux-amd64.tar.gz" | sha256sum -c
          tar xzf age-v1.3.2-linux-amd64.tar.gz
          install -m 755 sops age/age age/age-keygen "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Docker with the containerd image store (local images get digests)
        run: |
          if [[ $(docker info 2>/dev/null) != *io.containerd.snapshotter* ]]; then
            conf=/etc/docker/daemon.json
            { sudo cat "$conf" 2>/dev/null || echo '{}'; } |
              jq '.features["containerd-snapshotter"] = true' | sudo tee "$conf.new" >/dev/null
            sudo mv "$conf.new" "$conf" && sudo systemctl restart docker
          fi
          docker info | grep -i 'driver-type'
      - run: deploy/rehearsal.sh

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan source -r /src
