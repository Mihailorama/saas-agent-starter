name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      - name: Start infra
        run: docker compose up -d --wait postgres redis s3 temporal-ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm check
      - name: Release typecheck with official TypeScript (tsc, Go); see ADR 0011
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm typecheck
      - if: failure()
        run: docker compose logs --tail 100

  # Real-model eval of the golden sets (docs/adr/0009-llm-ops.md). Costs money, so it runs only
  # when the ANTHROPIC_API_KEY secret exists (never on fork PRs). `pnpm check` already runs the
  # key-free variant (`pnpm eval --fake-llm`) in the check job.
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::eval skipped, no ANTHROPIC_API_KEY secret"
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: env.ANTHROPIC_API_KEY != ''
        run: node scripts/eval.mjs

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build api web worker

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan source -r /src
