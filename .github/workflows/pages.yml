name: Pages

# The starter's landing page: apps/site built for GitHub Pages (docs/marketing.md "GitHub Pages").
# Runs only by dispatch: release-please.yml dispatches it on main after each release (1.0.0
# onwards), or by hand. Never on push or PR, and never from another branch (the `if` below).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      # Canonical URL; its path becomes Astro's base. Custom domain: set the repo variable
      # PAGES_SITE_URL (e.g. https://starter.example.com) and add the domain in Pages settings.
      SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://mihailorama.github.io/saas-agent-starter' }}
      # Share image by absolute URL (no media in git): GitHub's generated repository card unless the
      # repo variable PAGES_OG_IMAGE points to your own 1200x630 image.
      SITE_OG_IMAGE: ${{ vars.PAGES_OG_IMAGE || 'https://opengraph.githubassets.com/1/Mihailorama/saas-agent-starter' }}
      # "Talk to us" (managed offer): a mailto: or booking URL; unset = a GitHub issue (site.ts).
      SITE_CONTACT_URL: ${{ vars.PAGES_CONTACT_URL }}
      SITE_CONTACT_EMAIL: ${{ vars.PAGES_CONTACT_EMAIL }}
      SITE_LEGAL_JSON: ${{ vars.PAGES_LEGAL_JSON }}
      SITE_TELEGRAM_URL: ${{ vars.PAGES_TELEGRAM_URL }}
      SITE_WHATSAPP_URL: ${{ vars.PAGES_WHATSAPP_URL }}
      # The web release's browser tools (release.yml, same repository variables): the legal pages
      # list what they turn on (docs/legal.md; pnpm check:legal fails if one is missing here).
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_UMAMI_SCRIPT_URL: ${{ vars.VITE_UMAMI_SCRIPT_URL }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
      VITE_YM_ID: ${{ vars.VITE_YM_ID }}
      VITE_FORMBRICKS_WORKSPACE_ID: ${{ vars.VITE_FORMBRICKS_WORKSPACE_ID }}
      VITE_FORMBRICKS_API_HOST: ${{ vars.VITE_FORMBRICKS_API_HOST }}
      VITE_LANGFUSE_PUBLIC_KEY: ${{ vars.VITE_LANGFUSE_PUBLIC_KEY }}
      VITE_LANGFUSE_HOST: ${{ vars.VITE_LANGFUSE_HOST }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_CHATWOOT_BASE_URL: ${{ vars.VITE_CHATWOOT_BASE_URL }}
      VITE_CHATWOOT_WEBSITE_TOKEN: ${{ vars.VITE_CHATWOOT_WEBSITE_TOKEN }}
      VITE_TELEGRAM_SUPPORT_BOT: ${{ vars.VITE_TELEGRAM_SUPPORT_BOT }}
      VITE_BOOKING_ORIGIN: ${{ vars.VITE_BOOKING_ORIGIN }}
      VITE_BOOKING_LINK: ${{ vars.VITE_BOOKING_LINK }}
      SITE_DEPLOY_ENV: ${{ vars.SITE_DEPLOY_ENV || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile --filter site... --filter web...
      - run: pnpm --filter site build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
