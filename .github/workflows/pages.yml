name: Pages

# The starter's landing page: apps/site built for GitHub Pages (docs/marketing.md "GitHub Pages").
# Runs only by dispatch: release-please.yml dispatches it on main after each release (1.0.0
# onwards), or by hand. Never on push or PR, and never from another branch (the `if` below).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      # Canonical URL; its path becomes Astro's base. Custom domain: set the repo variable
      # PAGES_SITE_URL (e.g. https://starter.example.com) and add the domain in Pages settings.
      SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://mihailorama.github.io/saas-agent-starter' }}
      # Share image by absolute URL (no media in git): GitHub's generated repository card unless the
      # repo variable PAGES_OG_IMAGE points to your own 1200x630 image.
      SITE_OG_IMAGE: ${{ vars.PAGES_OG_IMAGE || 'https://opengraph.githubassets.com/1/Mihailorama/saas-agent-starter' }}
      # "Talk to us" (managed offer): a mailto: or booking URL; unset = a GitHub issue (site.ts).
      SITE_CONTACT_URL: ${{ vars.PAGES_CONTACT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile --filter site... --filter web...
      - run: pnpm --filter site build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
