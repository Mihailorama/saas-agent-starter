# App metrics arrive via OTLP from the collector; Temporal server is scraped directly.
global: { evaluation_interval: 30s }
rule_files: [/etc/prometheus/alerts.yml]
otlp:
  promote_resource_attributes: [service.name]
scrape_configs:
  - job_name: temporal
    static_configs:
      - targets: ["temporal:8000"]
  # Backup/restore-check metrics (compose.backup.yaml); target is down without that overlay.
  - job_name: pushgateway
    honor_labels: true
    scrape_interval: 15s
    static_configs:
      - targets: ["pushgateway:9091"]
