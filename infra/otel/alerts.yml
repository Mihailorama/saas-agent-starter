# Example alert rules, evaluated by Prometheus (works with and without Grafana). Visible in
# Prometheus /alerts and Grafana Alerting. Add Alertmanager to route notifications.
groups:
  - name: app
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="api", http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count{job="api"}[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations: { summary: "API 5xx rate above 5% for 5 minutes" }
      - alert: WorkerActivityFailures
        expr: sum(rate(temporal_activity_execution_failed_total[10m])) > 0
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Temporal activities keep failing" }
  - name: ai
    rules:
      - alert: AiScoreDrop
        # ai_score_avg: mean eval/review score per purpose (metric names: AGENTS.md "Observability").
        expr: avg by (purpose) (ai_score_avg) < 0.8 * avg by (purpose) (avg_over_time(ai_score_avg[7d] offset 1d))
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "AI score for {{ $labels.purpose }} dropped >20% vs last week" }
      - alert: AiCostSpike
        expr: sum(increase(ai_cost_usd_total[1h])) > 2 * sum(increase(ai_cost_usd_total[1h] offset 1d))
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "AI spend this hour is more than twice the same hour yesterday" }
  # Backups (compose.backup.yaml, docs/backups.md). Metrics come from the backup sidecar through
  # the Pushgateway. Thresholds assume the default schedule (daily backup, hourly object copy,
  # weekly restore check); change them together with BACKUP_*_CRON.
  - name: backups
    rules:
      - alert: BackupMetricsMissing
        expr: absent(backup_last_success_timestamp_seconds) or absent(restore_check_last_success_timestamp_seconds)
        for: 1h
        labels: { severity: page }
        annotations: { summary: "No backup or restore check on record: backups are not running" }
      - alert: BackupTooOld
        expr: time() - max(backup_last_success_timestamp_seconds) > 26 * 3600
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Last Postgres backup is older than 26 hours" }
      - alert: BackupFailed
        expr: max(backup_last_failure_timestamp_seconds) > max(backup_last_success_timestamp_seconds)
        labels: { severity: ticket }
        annotations: { summary: "The last Postgres backup failed (docker compose logs backup)" }
      - alert: WalArchiveFailing
        expr: max(pg_wal_archive_failing) == 1
        for: 10m
        labels: { severity: page }
        annotations:
          { summary: "WAL archiving fails: point-in-time recovery is stalled and pg_wal grows" }
      - alert: BackupStatusStale
        expr: time() - max(push_time_seconds{job="pgbackrest"}) > 30 * 60
        labels: { severity: ticket }
        annotations: { summary: "Backup sidecar stopped reporting (pushes every 5 minutes)" }
      - alert: ObjectBackupTooOld
        expr: time() - min(object_backup_last_success_timestamp_seconds) > 6 * 3600
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "App bucket copy is older than 6 hours" }
      - alert: RestoreCheckFailed
        expr: max(restore_check_last_failure_timestamp_seconds) > (max(restore_check_last_success_timestamp_seconds) or vector(0))
        labels: { severity: page }
        annotations: { summary: "The last restore check failed: backups may not be restorable" }
      - alert: RestoreCheckTooOld
        expr: time() - max(restore_check_last_success_timestamp_seconds) > 35 * 86400
        labels: { severity: ticket }
        annotations: { summary: "No successful restore check in 35 days" }
