apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    # OTLP SDKs push every 60s: $__rate_interval must span several pushes.
    jsonData: { timeInterval: 60s }
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2: # trace -> its log lines
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields: # log line -> its trace (trace_id is OTLP structured metadata)
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
        - name: Errors # same trace in the error tracker (GlitchTip/Sentry issue search by tag)
          matcherType: label
          matcherRegex: trace_id
          url: "$ERROR_TRACKER_ISSUES_URL?query=trace_id:$${__value.raw}"
          urlDisplayLabel: Errors for this trace
