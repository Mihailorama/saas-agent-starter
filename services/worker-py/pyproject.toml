[project]
name = "worker"
version = "0.1.0"
description = "Temporal worker for AI/data processing. Rust hot paths via saas-core."
requires-python = ">=3.12"
license = "MIT-0"
dependencies = [
  "anthropic>=2.5.0",
  "asyncpg>=0.32",
  "cryptography>=46",
  "en-core-web-sm",
  "httpx2>=2.16.0",
  "minio>=7.2.20",
  "openai>=3.46.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "opentelemetry-sdk>=1.45",
  "plane-sdk>=0.3.2",
  "posthog>=7.86",
  "presidio-analyzer>=2.2.366",
  "presidio-anonymizer>=2.2.366",
  "saas-core",
  "sentry-sdk>=2.74",
  "standardwebhooks>=1.1",
  "temporalio>=1.35",
]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.32",
  "license-expression>=30.4",
  "pip-licenses>=5.5",
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.sources]
saas-core = { path = "../../crates/core" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"] # assert is how pytest works

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["worker", "tests", "bench.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
