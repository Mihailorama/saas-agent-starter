packages:
  - apps/*
  - packages/*
allowBuilds:
  "@swc/core": true
  core-js: false # postinstall only prints a funding banner
  esbuild: true
  protobufjs: false
# Astro's optional image optimizer (sharp) bundles libvips (LGPL-3.0); the site uses Astro's
# passthrough image service instead (docs/adr/0021-marketing-layer.md).
ignoredOptionalDependencies:
  - sharp
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.17"
  - "@better-auth/drizzle-adapter@1.7.17"
  - "@better-auth/kysely-adapter@1.7.17"
  - "@better-auth/memory-adapter@1.7.17"
  - "@better-auth/mongo-adapter@1.7.17"
  - "@better-auth/prisma-adapter@1.7.17"
  - "@better-auth/telemetry@1.7.17"
  - "@tanstack/query-core@5.106.1"
  - "@tanstack/react-query@5.106.1"
  - better-auth@1.7.17
  - "@aws-sdk/checksums@3.1002.2"
  - "@aws-sdk/client-s3@3.1162.0"
  - "@aws-sdk/core@3.980.0"
  - "@aws-sdk/credential-provider-env@3.972.81"
  - "@aws-sdk/credential-provider-http@3.972.83"
  - "@aws-sdk/credential-provider-ini@3.973.26"
  - "@aws-sdk/credential-provider-login@3.972.88"
  - "@aws-sdk/credential-provider-node@3.972.93"
  - "@aws-sdk/credential-provider-process@3.972.81"
  - "@aws-sdk/credential-provider-sso@3.973.25"
  - "@aws-sdk/credential-provider-web-identity@3.972.87"
  - "@aws-sdk/middleware-sdk-s3@3.972.86"
  - "@aws-sdk/nested-clients@3.998.0"
  - "@aws-sdk/s3-request-presigner@3.1162.0"
  - "@aws-sdk/token-providers@3.1162.0"
  - "@fastify/cors@11.4.1"
overrides:
  # Security fixes (osv-scanner) for transitive deps whose parents pin old majors.
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  "@fastify/otel>minimatch": ^11.0.1
  # openapi-typescript prints with the TypeScript 5 JS API, which TypeScript 7 (Go) no longer ships.
  "openapi-typescript>typescript": 5.9.3
